<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Blockchain Chat</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background: #f7f7f7; }
    h2 { color: #333; }
    #chat-box {
      border: 2px solid #ccc;
      background: #fff;
      height: 350px;
      overflow-y: auto;
      padding: 10px;
      border-radius: 10px;
    }
    .msg { margin: 5px 0; padding: 8px; border-radius: 8px; width: fit-content; max-width: 70%; }
    .me { background: #b3e5fc; margin-left: auto; color: #000; }
    .other { background: #c8e6c9; color: #000; }
    #input-area { margin-top: 15px; display: flex; gap: 10px; }
    input { flex: 1; padding: 8px; border-radius: 5px; border: 1px solid #aaa; }
    button { padding: 8px 15px; border: none; border-radius: 5px; background: #1976d2; color: white; cursor: pointer; }
    button:hover { background: #0d47a1; }
  </style>
</head>
<body>
  <h2 id="title">💬 Blockchain Chat</h2>
  <div id="chat-box"></div>

  <div id="input-area">
    <input type="text" id="msg" placeholder="Type a message">
    <button onclick="send()">Send</button>
  </div>

  <script>
    const api = window.location.origin;
    const username = api.includes("5001") ? "Siva" : "Santhosh";

    document.getElementById("title").innerHTML = `💬 Blockchain Chat (${username})`;

    async function loadChat() {
      const res = await fetch(api + "/chain");
      const data = await res.json();
      const box = document.getElementById("chat-box");
      box.innerHTML = "";
      data.forEach(block => {
        if (block.data !== "Genesis Block") {
          const div = document.createElement("div");
          const [sender, message] = block.data.split(":", 2);
          if (sender && sender.trim() === username) div.className = "msg me";
          else div.className = "msg other";
          div.textContent = block.data;
          box.appendChild(div);
        }
      });
      box.scrollTop = box.scrollHeight;
    }

    async function send() {
      const text = document.getElementById("msg").value.trim();
      if (!text) return;
      await fetch(api + "/add_block", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({data: username + ": " + text})
      });
      document.getElementById("msg").value = "";
      loadChat();
    }

    setInterval(loadChat, 2000);
    loadChat();
  </script>
</body>
</html>
